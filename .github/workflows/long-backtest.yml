name: Long Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: First month (YYYY-MM)
        required: true
        default: "2022-01"
      end:
        description: Last month (YYYY-MM)
        required: true
        default: "2026-08"
  pull_request:
    paths:
      - ".github/workflows/long-backtest.yml"
      - "scripts/long_backtest.py"
      - "cryptopilot/research.py"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -e .
      - name: Run multi-year walk-forward backtest
        env:
          START_MONTH: ${{ inputs.start || '2022-01' }}
          END_MONTH: ${{ inputs.end || '2026-08' }}
        run: |
          python scripts/long_backtest.py \
            --symbols BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT DOGEUSDT \
            --start "$START_MONTH" \
            --end "$END_MONTH" \
            --confidence 84 \
            --short-confidence 86 \
            --risk-pct 0.5 \
            --max-portfolio-risk-pct 1.0 \
            --max-same-side 1 \
            --strategy-lab \
            --early-radar-test \
            --cost-bps 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cryptopilot-long-backtest
          path: reports/
          if-no-files-found: error
          retention-days: 30
