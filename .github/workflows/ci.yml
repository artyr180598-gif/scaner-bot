name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: python -m compileall -q cryptopilot
      - run: python -m pytest
      - run: docker build -t cryptopilot-ci .
